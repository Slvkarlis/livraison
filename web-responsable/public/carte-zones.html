<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Une URL HTTP et un Referer valide sont requis par les serveurs de tuiles OSM. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Carte des zones de livraison</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    /* Fond de carte aux couleurs de FleetPulse : graphite, ambre pour la route */
    .leaflet-tile-pane { filter: grayscale(1) contrast(1.08) brightness(1.05); }
    .leaflet-container { background: #ECEBE7; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .leaflet-tooltip { background: #15171A; color: #fff; border: 0; border-radius: 8px; font-weight: 600; }
    .leaflet-tooltip-top::before { border-top-color: #15171A; }
    #aide { position: absolute; z-index: 1000; background: #fff; bottom: 12px; left: 12px; padding: 8px 12px; border-radius: 10px; font: 600 13px 'Plus Jakarta Sans', system-ui, sans-serif; color: #15171A; box-shadow: 0 10px 24px -12px rgba(21,23,26,.4); }
  </style>
</head>
<body>
<div id="map" aria-label="Carte des zones de livraison"></div>
<div id="aide">Cliquez pour ajouter les sommets. Les zones existantes sont en gris.</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" onerror="parent.postMessage({type:'carte-erreur'},'*')"></script>
<script>
if (window.L) {
  const map = L.map('map').setView([36.8065, 10.1815], 12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">contributeurs OpenStreetMap</a>'
  }).on('tileerror', () => parent.postMessage({ type: 'carte-erreur' }, '*')).addTo(map);
  const fond = L.layerGroup().addTo(map), trace = L.layerGroup().addTo(map);
  let points = [], edition = false, centre = false;

  function dessiner() {
    trace.clearLayers();
    if (points.length > 1) L.polygon(points, { color: '#F2B233', weight: 4, lineCap: 'round' }).addTo(trace);
    points.forEach((p, i) => L.circleMarker(p, { radius: 6, color: '#15171A', fillColor: '#F2B233', fillOpacity: 1, weight: 2 }).bindTooltip(String(i + 1)).addTo(trace));
  }

  map.on('click', e => {
    if (!edition) return;
    points.push([e.latlng.lat, e.latlng.lng]);
    dessiner();
    parent.postMessage({ type: 'sommets', points: points.map(p => ({ latitude: p[0], longitude: p[1] })) }, '*');
  });

  window.addEventListener('message', e => {
    if (e.source !== parent || e.data?.type !== 'zones') return;
    const d = e.data;
    edition = d.edition;
    points = d.points.map(p => [p.latitude, p.longitude]);
    fond.clearLayers();
    d.zones.forEach(z => L.polygon(z.polygone.map(p => [p.latitude, p.longitude]), {
      color: '#15171A', weight: 1.5, dashArray: '4 4', fillColor: '#F2B233', fillOpacity: .14
    }).bindTooltip(document.createTextNode(z.nom + ' · ' + z.fraisLivraison + ' DT')).addTo(fond));
    dessiner();
    document.getElementById('aide').textContent = edition
      ? 'Cliquez pour ajouter les sommets. Les zones existantes sont en gris.'
      : 'Couverture des zones existantes. Ouvrez une zone pour la modifier.';
    if (!centre) {
      const b = L.featureGroup([...fond.getLayers(), ...trace.getLayers()]).getBounds();
      if (b.isValid()) { map.fitBounds(b, { padding: [20, 20], maxZoom: 14 }); centre = true; }
    }
    parent.postMessage({ type: 'carte-configuree' }, '*');
  });

  parent.postMessage({ type: 'carte-prete' }, '*');
}
</script>
</body>
</html>
