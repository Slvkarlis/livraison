# Tarification des livraisons (montants en DT)
# frais = max(frais-minimum, (remuneration-base + remuneration-par-km * km + carburant) * (1 + marge-beneficiaire))
app.tarification.facteur-route=1.3
app.tarification.prix-carburant-litre=2.525
app.tarification.consommation-reference=7.0
app.tarification.remuneration-base=1.5
app.tarification.remuneration-par-km=0.4
app.tarification.marge-beneficiaire=0.30
app.tarification.frais-minimum=3.0
# Livraison immediate : +50 %, livreur envoye dans les 60 minutes
app.tarification.majoration-immediate=0.5
app.tarification.delai-immediat-minutes=60
app.tarification.distance-max-km=25
