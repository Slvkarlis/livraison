spring.datasource.url=jdbc:h2:mem:sprint1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.jwt.secret=test-only-jwt-secret-at-least-thirty-two-bytes-long
app.jwt.expiration-ms=60000
app.jwt.refresh-expiration-ms=600000
app.admin.email=admin@sprint1.test
app.admin.mot-de-passe=test-admin-password
app.demo.enabled=false
app.code.delai-renvoi-secondes=60
logging.level.root=WARN
debug=false
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
# Sprint 4 : les scenarios des sprints precedents gardent l'affectation simple et aucun cycle periodique ne tourne.
# Les tests Sprint4* activent le dispatch par lots dans leurs proprietes.
app.dispatch.par-lots=false
app.dispatch.planificateur=false
app.dispatch.fenetre-regroupement-secondes=0
app.ia.url=
