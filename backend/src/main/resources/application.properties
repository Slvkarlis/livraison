spring.application.name=livraison

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/livraison?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port = 8083

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# JWT (use a long random value in production)
app.jwt.secret=uZ58RY4qv47riB1L9M7Ks_25JQUN2xAkqbtLktCb7eU
app.jwt.expiration-ms=86400000
# Jeton de rafraichissement (US-102) : 30 jours, renouvele a chaque utilisation
app.jwt.refresh-expiration-ms=2592000000

# Codes a 6 chiffres : OTP d'inscription (US-101), mot de passe oublie (US-107)
app.code.duree-minutes=10
app.code.tentatives-max=5
app.code.delai-renvoi-secondes=60

# Codes dans les logs uniquement si flag explicite ET profil dev/demo actif.
app.demo.enabled=${APP_DEMO_ENABLED:false}

# Compte administrateur cree au demarrage s'il n'existe pas
app.admin.email=${ADMIN_EMAIL:admin@fleetpulse.tn}
app.admin.mot-de-passe=${ADMIN_PASSWORD:admin12345}

# Depot unique d'ou partent les livraisons
app.depot.adresse=Dépôt FleetPulse, Tunis
app.depot.latitude=36.8065
app.depot.longitude=10.1815

# Tarification des livraisons (montants en DT)
# frais = max(frais-minimum, (remuneration-base + remuneration-par-km * km + carburant) * (1 + marge-beneficiaire))
app.tarification.facteur-route=1.3
app.tarification.prix-carburant-litre=2.525
app.tarification.consommation-reference=7.0
app.tarification.remuneration-base=1.5
app.tarification.remuneration-par-km=0.4
app.tarification.marge-beneficiaire=0.30
app.tarification.frais-minimum=3.0
# Livraison immediate : +50 %, livreur envoye dans les 60 minutes
app.tarification.majoration-immediate=0.5
app.tarification.delai-immediat-minutes=60
app.tarification.distance-max-km=25

# Sprint 2 : limites COD (minimum sur les articles, maximum sur le total).
app.commandes.minimum=${COMMANDES_MINIMUM:1}
app.commandes.maximum=${COMMANDES_MAXIMUM:1000}
app.commandes.actives-max=${COMMANDES_ACTIVES_MAX:3}
app.commandes.intervalle-secondes=${COMMANDES_INTERVALLE_SECONDES:30}
# Données démo optionnelles, uniquement avec APP_DEMO_ENABLED et profil dev/demo.
app.sprint2.donnees-demo=${SPRINT2_DONNEES_DEMO:false}

# Stripe (mode test) : cles fournies par variables d'environnement, jamais commitees.
# Sans STRIPE_SECRET_KEY / STRIPE_PUBLISHABLE_KEY, le paiement par carte est desactive.
app.stripe.cle-secrete=sk_test_51RzcZ5RxG3QWCAMnj3sdbLKGyHNETZqZamtlXel82ASR88GcPYF4TvhLGm3TLsCHguWLAyzIuPAzKJfnpkEAyNSh00l1DOxyZy
app.stripe.cle-publique=pk_test_51RzcZ5RxG3QWCAMnrPb3iI9q15flKTtelCTEsiSX0KGBzpgQpAXmBV6LwzFroik1UjVpgkcZlGjqm8fIHn5qOuGl00ixvF3FJA
app.stripe.cle-webhook=${STRIPE_WEBHOOK_SECRET:}
app.stripe.devise=${STRIPE_CURRENCY:eur}
