spring.application.name=livraison

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/livraison?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port = 8083

# Swagger UI et specification OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# JWT (use a long random value in production)
app.jwt.secret=uZ58RY4qv47riB1L9M7Ks_25JQUN2xAkqbtLktCb7eU
app.jwt.expiration-ms=86400000
# Jeton de rafraichissement (US-102) : 30 jours, renouvele a chaque utilisation
app.jwt.refresh-expiration-ms=2592000000

# Codes a 6 chiffres : OTP d'inscription (US-101), mot de passe oublie (US-107)
app.code.duree-minutes=10
app.code.tentatives-max=5
app.code.delai-renvoi-secondes=60

# Codes dans les logs uniquement si flag explicite ET profil dev/demo actif.
app.demo.enabled=${APP_DEMO_ENABLED:false}

# Compte administrateur cree au demarrage s'il n'existe pas
app.admin.email=${ADMIN_EMAIL:admin@fleetpulse.tn}
app.admin.mot-de-passe=${ADMIN_PASSWORD:admin12345}

# Apercu Expo web en developpement : origines separees par des virgules, ex. http://localhost:8081
# Vide par defaut : aucune requete cross-origin acceptee.
app.cors.origines=${CORS_ORIGINES:}

# Sprint 2 : limites COD (minimum sur les articles, maximum sur le total).
app.commandes.minimum=${COMMANDES_MINIMUM:1}
app.commandes.maximum=${COMMANDES_MAXIMUM:1000}
app.commandes.actives-max=${COMMANDES_ACTIVES_MAX:10}
app.commandes.intervalle-secondes=${COMMANDES_INTERVALLE_SECONDES:30}
# Données démo optionnelles, uniquement avec APP_DEMO_ENABLED et profil dev/demo.
app.sprint2.donnees-demo=${SPRINT2_DONNEES_DEMO:false}
app.sprint6.donnees-demo=${SPRINT6_DONNEES_DEMO:false}
app.sprint6.mot-de-passe-demo=${SPRINT6_MOT_DE_PASSE_DEMO:demo-sprint6-password}


# Sprint 3 : cle HMAC des QR de remise (US-305) ; par defaut le secret JWT. 32 caracteres minimum.
app.remise.secret=${APP_REMISE_SECRET:${app.jwt.secret}}

# Sprint 3 : push Expo (US-304). Desactive par defaut : notifications journalisees, visibles dans l'application.
app.push.expo.actif=${APP_PUSH_EXPO_ACTIF:false}
app.push.expo.jeton-acces=${APP_PUSH_EXPO_JETON:}

# Sprint 4 : dispatch par lots (US-402 a US-407). par-lots=false : affectation simple du Sprint 2 bis.
app.dispatch.par-lots=${DISPATCH_PAR_LOTS:true}
app.dispatch.delai-offre-secondes=${DISPATCH_DELAI_OFFRE_SECONDES:60}
app.dispatch.delai-recherche-max-minutes=${DISPATCH_DELAI_RECHERCHE_MAX_MINUTES:10}
app.dispatch.duree-a-bord-max-minutes=${DISPATCH_DUREE_A_BORD_MAX_MINUTES:35}
app.dispatch.rayon-collecte-km=${DISPATCH_RAYON_COLLECTE_KM:1.5}
app.dispatch.fenetre-regroupement-secondes=${DISPATCH_FENETRE_REGROUPEMENT_SECONDES:30}
app.dispatch.planificateur=${DISPATCH_PLANIFICATEUR:true}
app.dispatch.intervalle-ms=${DISPATCH_INTERVALLE_MS:15000}

# Sprint 4 : service d'IA Python (dossier ia/). Vide : regles Java uniquement (mode degrade).
app.ia.url=${APP_IA_URL:}
app.ia.delai-ms=${APP_IA_DELAI_MS:800}
