spring.application.name=livraison

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/livraison?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port = 8083

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# JWT (use a long random value in production)
app.jwt.secret=uZ58RY4qv47riB1L9M7Ks_25JQUN2xAkqbtLktCb7eU
app.jwt.expiration-ms=86400000
# Jeton de rafraichissement (US-102) : 30 jours, renouvele a chaque utilisation
app.jwt.refresh-expiration-ms=2592000000

# Codes a 6 chiffres : OTP d'inscription (US-101), mot de passe oublie (US-107)
app.code.duree-minutes=10
app.code.tentatives-max=5
app.code.delai-renvoi-secondes=60

# Codes dans les logs uniquement si flag explicite ET profil dev/demo actif.
app.demo.enabled=${APP_DEMO_ENABLED:false}

# Compte administrateur cree au demarrage s'il n'existe pas
app.admin.email=${ADMIN_EMAIL:admin@fleetpulse.tn}
app.admin.mot-de-passe=${ADMIN_PASSWORD:admin12345}

# Apercu Expo web en developpement : origines separees par des virgules, ex. http://localhost:8081
# Vide par defaut : aucune requete cross-origin acceptee.
app.cors.origines=${CORS_ORIGINES:}

# Sprint 2 : limites COD (minimum sur les articles, maximum sur le total).
app.commandes.minimum=${COMMANDES_MINIMUM:1}
app.commandes.maximum=${COMMANDES_MAXIMUM:1000}
app.commandes.actives-max=${COMMANDES_ACTIVES_MAX:3}
app.commandes.intervalle-secondes=${COMMANDES_INTERVALLE_SECONDES:30}
# Données démo optionnelles, uniquement avec APP_DEMO_ENABLED et profil dev/demo.
app.sprint2.donnees-demo=${SPRINT2_DONNEES_DEMO:false}

